apiVersion: v1
kind: Secret
metadata:
  name: kinugasa-console-config
  namespace: kinugasa-recording
type: Opaque
stringData:
  DATABASE_URL: postgresql://kinugasa:replace-me@postgres.example.com:5432/kinugasa?sslmode=require
  KINUGASA_S3_BUCKET: recording-production
  LIVEKIT_URL: wss://livekit.example.com
  LIVEKIT_API_KEY: replace-me
  LIVEKIT_API_SECRET: replace-me
  # Generate with: openssl rand -base64 32
  VIDEO_GATEWAY_RIST_ENCRYPTION_PEPPER: replace-with-at-least-32-random-bytes
---
apiVersion: v1
kind: Secret
metadata:
  name: kinugasa-object-storage
  namespace: kinugasa-recording
type: Opaque
stringData:
  KINUGASA_S3_BUCKET: recording-production
  KINUGASA_S3_REGION: ap-northeast-1
  KINUGASA_S3_ENDPOINT: ""
  KINUGASA_S3_PATH_STYLE: "false"
  AWS_ACCESS_KEY_ID: replace-me
  AWS_SECRET_ACCESS_KEY: replace-me
