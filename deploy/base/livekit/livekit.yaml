apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
data:
  livekit.yaml: |
    port: 7880
    bind_addresses: ["0.0.0.0"]
    redis:
      address: redis:6379
    keys:
      devkey: local-livekit-secret-0123456789abcd
    ingress:
      rtmp_base_url: rtmp://livekit-ingress:1935/x
      whip_base_url: http://livekit-ingress:8080/whip
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
    spec:
      enableServiceLinks: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: livekit
        image: livekit/livekit-server:latest
        imagePullPolicy: IfNotPresent
        args:
        - --config
        - /etc/livekit/livekit.yaml
        envFrom:
        - configMapRef:
            name: livekit-runtime-env
        ports:
        - name: signal
          containerPort: 7880
          protocol: TCP
        - name: rtc-tcp
          containerPort: 7881
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /etc/livekit
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: config
        configMap:
          name: livekit-config
---
apiVersion: v1
kind: Service
metadata:
  name: livekit
spec:
  type: ClusterIP
  selector:
    app: livekit
  ports:
  - name: signal
    port: 7880
    targetPort: signal
    protocol: TCP
  - name: rtc-tcp
    port: 7881
    targetPort: rtc-tcp
    protocol: TCP
