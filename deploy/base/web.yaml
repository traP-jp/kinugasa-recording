apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-console
  namespace: kinugasa-recording
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: kinugasa-recording
      app.kubernetes.io/component: web-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kinugasa-recording
        app.kubernetes.io/component: web-console
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: web-console
        image: kinugasa-recording/web:latest
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        readinessProbe:
          httpGet:
            path: /
            port: http
        livenessProbe:
          httpGet:
            path: /
            port: http
          initialDelaySeconds: 5
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: nginx-cache
          mountPath: /var/cache/nginx
        - name: nginx-run
          mountPath: /var/run
        - name: nginx-tmp
          mountPath: /tmp
      volumes:
      - name: nginx-cache
        emptyDir: {}
      - name: nginx-run
        emptyDir: {}
      - name: nginx-tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: web-console
  namespace: kinugasa-recording
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kinugasa-recording
    app.kubernetes.io/component: web-console
  ports:
  - name: http
    port: 80
    targetPort: http
