apiVersion: v1
kind: ConfigMap
metadata:
  name: livekit-config
data:
  livekit.yaml: |
    port: 7880
    bind_addresses: ["0.0.0.0"]
    redis:
      address: redis:6379
    keys:
      devkey: local-livekit-secret-0123456789abcd
    ingress:
      rtmp_base_url: rtmp://livekit-ingress:1935/x
      whip_base_url: http://livekit-ingress:8080/whip
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: livekit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: livekit
  template:
    metadata:
      labels:
        app: livekit
    spec:
      enableServiceLinks: false
      containers:
      - name: livekit
        image: livekit/livekit-server:latest
        imagePullPolicy: IfNotPresent
        args:
        - --config
        - /etc/livekit/livekit.yaml
        env:
        - name: NODE_IP
          value: 172.18.0.2
        - name: LIVEKIT_RTC_TCP_PORT
          value: "31877"
        - name: LIVEKIT_RTC_PORT_RANGE_START
          value: "50000"
        - name: LIVEKIT_RTC_PORT_RANGE_END
          value: "50020"
        - name: LIVEKIT_RTC_USE_EXTERNAL_IP
          value: "false"
        ports:
        - name: signal
          containerPort: 7880
          protocol: TCP
        - name: rtc-tcp
          containerPort: 31877
          protocol: TCP
        volumeMounts:
        - name: config
          mountPath: /etc/livekit
      volumes:
      - name: config
        configMap:
          name: livekit-config
---
apiVersion: v1
kind: Service
metadata:
  name: livekit
spec:
  type: NodePort
  selector:
    app: livekit
  ports:
  - name: signal
    port: 7880
    targetPort: signal
    nodePort: 30780
    protocol: TCP
  - name: rtc-tcp
    port: 7881
    targetPort: rtc-tcp
    nodePort: 31877
    protocol: TCP
