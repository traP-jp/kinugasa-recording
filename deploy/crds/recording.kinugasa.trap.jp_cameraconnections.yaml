                pattern: ^[a-z](?:[a-z0-9-]{0,30}[a-z0-9])?$
                type: string
                x-kubernetes-validations:
                - message: cameraName is immutable
                  rule: self == oldSelf
              sessionID:
                description: SessionID is the immutable database identifier of the
                  owning Session.
                pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$
