    singular: cameraconnection
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .spec.cameraName
      name: Camera
      type: string
    - jsonPath: .status.workerPodName
      name: Worker
      type: string
    - jsonPath: .metadata.creationTimestamp
