                format: int64
                type: integer
              observedWorkerRestartCount:
                description: ObservedWorkerRestartCount is the latest handled restart
                  count for the current worker Pod.
                format: int32
                type: integer
              phase:
                description: Phase mirrors the CameraConnection state stored by console-server.
                enum:
                - Activating
                - Waiting
                - Connected
                - Error
                type: string
              pvcName:
                type: string
              videoWorkerID:
                description: VideoWorkerID identifies the currently running video-worker
