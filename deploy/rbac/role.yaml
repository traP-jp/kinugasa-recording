---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kinugasa-recording-operator
rules:
- apiGroups:
  - ""
  resources:
  - persistentvolumeclaims
  - pods
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - recording.kinugasa.trap.jp
  resources:
  - cameraconnections
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - recording.kinugasa.trap.jp
  resources:
  - cameraconnections/finalizers
  verbs:
  - update
- apiGroups:
  - recording.kinugasa.trap.jp
  resources:
  - cameraconnections/status
  verbs:
  - get
  - patch
  - update
