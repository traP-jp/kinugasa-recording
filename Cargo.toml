[workspace]
members = [
    "crates/kinugasa-app",
    "crates/kinugasa-core",
    "crates/kinugasa-media",
    "crates/kinugasa-mysql",
    "crates/kinugasa-s3",
]
exclude = ["video-gateway"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
async-trait = "0.1.89"
aws-config = "1"
aws-sdk-s3 = "1"
base64 = "0.22.1"
bytes = "1.10.1"
chrono = "0.4.42"
humantime = "2.3.0"
moq-mux = "0.10.6"
moq-net = "0.3.5"
moq-tokio = { version = "0.19.17", default-features = false, features = ["noq", "ring"] }
regex = "1.11.2"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false }
thiserror = "2.0.16"
tokio = "1.47.1"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
url = "2.5.7"
uuid = "1.18.1"
