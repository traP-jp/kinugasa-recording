version: v2
modules:
  - path: contracts/console-video-uploader
  - path: contracts/console-video-worker
lint:
  use:
    - STANDARD
  except:
    # The contract lives under a component-oriented contracts directory.
    - PACKAGE_DIRECTORY_MATCH
    # Bidirectional stream envelopes are intentionally named for their sender.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
