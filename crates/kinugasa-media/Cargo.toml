[package]
name = "kinugasa-media"
description = "Integrated RIST ingress, recorder, and preview SFU for kinugasa recording"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
kinugasa-core = { path = "../kinugasa-core" }
rist-rs = { git = "https://github.com/comavius/rist-rs.git", rev = "28b670e428438e96c88d5a91cf5d18623452c875" }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "sync", "time"] }
tracing.workspace = true
url.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
tempfile = "3.23.0"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
