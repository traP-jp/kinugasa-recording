[package]
name = "kinugasa-media"
description = "Integrated RIST ingress, recorder, and preview SFU for kinugasa recording"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
async-trait.workspace = true
base64.workspace = true
bytes.workspace = true
chrono.workspace = true
hmac.workspace = true
kinugasa-core = { path = "../kinugasa-core" }
moq-mux.workspace = true
moq-net.workspace = true
moq-tokio.workspace = true
rist-rs.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tracing.workspace = true
transmux = { version = "=0.24.1", default-features = false, features = ["std"] }
url.workspace = true
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
broadcast-common = "=9.3.0"
mpeg2ts = "0.6.1"
tempfile = "3.23.0"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
