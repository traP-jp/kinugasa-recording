[package]
name = "kinugasa-app"
description = "Composition root and executable for kinugasa recording v3"
edition.workspace = true
license.workspace = true
version.workspace = true
default-run = "kinugasa"

[[bin]]
name = "kinugasa"
path = "src/main.rs"

[dependencies]
axum.workspace = true
base64.workspace = true
chrono.workspace = true
humantime.workspace = true
kinugasa-core = { path = "../kinugasa-core" }
kinugasa-media = { path = "../kinugasa-media" }
kinugasa-mysql = { path = "../kinugasa-mysql" }
kinugasa-s3 = { path = "../kinugasa-s3" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
url.workspace = true
