parameters:
  - $ref: ../openapi.yaml#/components/parameters/SessionName
  - $ref: ../openapi.yaml#/components/parameters/TakeName

get:
  operationId: getFinishedTake
  tags: [Takes]
  summary: FinishedTakeとVideoFileの詳細を取得する
  responses:
    '200':
      description: FinishedTakeの詳細
      content:
        application/json:
          schema:
            $ref: ../schemas/take.yaml#/FinishedTakeDetail
    '404':
      $ref: ../openapi.yaml#/components/responses/NotFound
    '500':
      $ref: ../openapi.yaml#/components/responses/InternalServerError
