parameters:
  - $ref: ../openapi.yaml#/components/parameters/SessionName
  - $ref: ../openapi.yaml#/components/parameters/CameraName

delete:
  operationId: deleteCamera
  tags: [Cameras]
  summary: cameraを削除する
  description: >-
    CameraConnectionの削除を要求する。Shutdown commandを永続化してworkerへ送り、
    Pod、PVC、CameraConnectionを削除する。uploadingなVideoFileがある場合は
    force=trueが必要で、対象VideoFileをerroredにしてuploadをabortする。
    CameraIdentityと名前の使用履歴は残る。
  parameters:
    - name: force
      in: query
      required: false
      description: uploadingなVideoFileをerroredにし、uploadをabortして強制削除する。
      schema:
        type: boolean
        default: false
  responses:
    '204':
      description: cameraの削除要求を受理した
    '404':
      $ref: ../openapi.yaml#/components/responses/NotFound
    '400':
      $ref: ../openapi.yaml#/components/responses/BadRequest
    '409':
      $ref: ../openapi.yaml#/components/responses/Conflict
    '500':
      $ref: ../openapi.yaml#/components/responses/InternalServerError
